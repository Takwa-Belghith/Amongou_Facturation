<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amongout – Factures</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0a1d3a;--mute:#5d6b85;--line:#d9dfeb;--acc:#002b60;--accfg:#fff;--ok:#2f6b46;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1014;--card:#141b24;--ink:#eef1f6;--mute:#9aa7bd;--line:#2a3646;--acc:#d2bb90;--accfg:#0c1014;--ok:#a9cf93}}
:root[data-theme="dark"]{--bg:#0c1014;--card:#141b24;--ink:#eef1f6;--mute:#9aa7bd;--line:#2a3646;--acc:#d2bb90;--accfg:#0c1014;--ok:#a9cf93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
h1{font:700 30px/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:14px;color:var(--acc)}.logo{flex:none;width:56px;height:56px;border-radius:50%;display:block}#sheet .logo{width:64px;height:64px}h2{font-size:16px;font-weight:600;margin:0 0 10px}
.wrap{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.line{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto}.line label:first-child{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:3px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 12px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.x{padding:4px 9px;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.line{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.4fr) auto;gap:6px;align-items:end;margin-bottom:8px}
.line label{margin:0}
.lt{font-size:12px;color:var(--mute);grid-column:1/-1;margin-top:-4px;text-align:right}
.lt input{width:130px;display:inline-block;margin:0 0 0 6px;text-align:right}
.scroll{overflow-x:auto}
details summary{cursor:pointer;font-weight:600}
.hist{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start}
/* invoice sheet stays white on screen and print */
#sheet{border-top:6px solid #d2bb90!important;background:#fff;color:#0a1d3a;border:1px solid var(--line);border-radius:6px;padding:28px;font-size:14px}
#sheet h3{margin:0;font:700 26px 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;color:#002b60}
#sheet .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #002b60;padding-bottom:12px;margin-bottom:14px}
#sheet .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #002b60;padding-bottom:12px;margin-bottom:12px}#sheet .hd h3{flex:1;text-align:center}#sheet .meta{text-align:right;font-size:13px}#sheet .blk{margin-bottom:10px}#sheet td,#sheet th{border:1px solid #c9d0de}#sheet table{width:100%;border-collapse:collapse;margin:14px 0}
#sheet th{background:#002b60;border-bottom:3px solid #d2bb90;color:#fff;text-align:left;padding:7px;font-weight:600}
#sheet td{padding:7px;border-bottom:1px solid #ddd}
#sheet .r{text-align:right}
#sheet .tot{margin-left:auto;width:min(280px,100%)}
#sheet .tot div{display:flex;justify-content:space-between;padding:4px 0}
#sheet .net{font-weight:800;color:#002b60;border-top:2px solid #0a1d3a;margin-top:4px;padding-top:6px!important}
#sheet .words{margin-top:14px}
@page{size:A4;margin:0}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{margin:0}body{background:#fff}.edit,.noprint{display:none!important}.wrap{display:block;padding:0}.sticky{position:static}#sheet{border:0;padding:14mm 16mm;box-sizing:border-box}}
</style>
</head>

const $=id=>document.getElementById(id);
const KEY='facture-amongout-v1';
let S={seller:{name:'Amongout Pâtisserie',owner:'Fatma Belguith',mf:'1954261G',addr:'Route de l\'Ain - Km 2,5',tel:'44905009',mail:'Amongout2019@gmail.com',ig:'@amongout_'},
 catalog:[{id:1,name:'Gâteau',price:55,u:''}],units:[],history:[],counter:5,counterD:1,cur:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
let fh=null,pend=null,wt=null;
const canFile='showSaveFilePicker' in window;
function status(t,ok){const e=$('fstat');e.textContent=t;e.style.color=ok?'var(--ok)':'var(--mute)'}
function idb(fn,mode){return new Promise((res,rej)=>{const q=indexedDB.open('amongout',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');
 q.onsuccess=()=>{const tx=q.result.transaction('h',mode||'readonly');const o=fn(tx.objectStore('h'));tx.oncomplete=()=>res(o&&o.result);tx.onerror=()=>rej(tx.error)};q.onerror=()=>rej(q.error)})}
async function writeFile(){if(!fh)return;try{const w=await fh.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();status('Fichier « '+fh.name+' » synchronisé ✓',true)}
 catch(e){status('Écriture impossible. Cliquez sur « Reconnecter ».',false);pend=fh;fh=null;$('frec').hidden=false}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(wt);wt=setTimeout(writeFile,400)}

function merge(d){S=Object.assign(S,d);if(!S.cur)S.cur=fresh();fillAll()}
async function loadFrom(h){fh=h;pend=null;$('frec').hidden=true;
 try{const t=await(await h.getFile()).text();if(t.trim())merge(JSON.parse(t))}catch(e){status('Fichier illisible (JSON invalide ?)',false);fh=null;return}
 try{await idb(st=>st.put(h,'fh'),'readwrite')}catch(e){}
 await writeFile()}
async function initFile(){
 if(!canFile){$('flink').hidden=true;status('Ce navigateur ne peut pas écrire dans un fichier : utilisez Exporter / Importer (ou Chrome / Edge sur ordinateur).',false);return}
 status('Aucun fichier lié : les données sont seulement dans ce navigateur.',false);
 try{const h=await idb(st=>st.get('fh'));if(!h)return;
  if(await h.queryPermission({mode:'readwrite'})==='granted')await loadFrom(h);
  else{pend=h;$('frec').hidden=false;status('Fichier « '+h.name+' » à reconnecter (un clic).',false)}}catch(e){}}
const year=()=>new Date().getFullYear();
const pad=n=>String(n).padStart(4,'0');
function mknum(t){return (t==='devis'?'D':'')+pad(t==='devis'?S.counterD:S.counter)+'/'+year()}
function fresh(t){t=t||'facture';return{id:Date.now(),type:t,num:mknum(t),date:new Date().toISOString().slice(0,10),client:'',cmf:'',lines:[{name:'',qty:1,price:0}],timbre:t==='devis'?0:1}}
if(!S.cur)S.cur=fresh();

/* money in millimes (integers) to avoid rounding errors */
const mil=x=>Math.round((parseFloat(x)||0)*1000);
function fmt(m){const neg=m<0;m=Math.abs(m);const d=Math.floor(m/1000),f=String(m%1000).padStart(3,'0');
 return (neg?'-':'')+String(d).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+f}
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const T=['','','vingt','trente','quarante','cinquante','soixante'];
function b100(n){if(n<17)return U[n];if(n<20)return 'dix-'+U[n-10];
 if(n<70){const t=Math.floor(n/10),u=n%10;return T[t]+(u==1?' et un':u?'-'+U[u]:'')}
 if(n<80){const u=n-60;return u==11?'soixante et onze':'soixante-'+b100(u)}
 const u=n-80;return 'quatre-vingt'+(u?'-'+b100(u):'s')}
function b1000(n,fin){const h=Math.floor(n/100),r=n%100;let s='';
 if(h){s=h==1?'cent':U[h]+' cent';if(!r&&h>1&&fin)s+='s'}
 if(r)s+=(s?' ':'')+b100(r);return s}
function words(n){if(n==0)return 'zéro';const k=Math.floor(n/1000),r=n%1000;let s='';
 if(k)s=k==1?'mille':b1000(k,false)+' mille';
 if(r)s+=(s?' ':'')+b1000(r,true);return s}
function amountWords(m){const d=Math.floor(m/1000),f=m%1000;
 let s=words(d)+(d>1?' dinars':' dinar');if(f)s+=' et '+words(f)+(f>1?' millimes':' millime');
 return s.charAt(0).toUpperCase()+s.slice(1)+'.'}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BASE_UNITS=['pièce','kg'];
const allUnits=()=>[...BASE_UNITS,...(S.units||[]).filter(u=>!BASE_UNITS.includes(u))];
function unitOpts(sel){sel=sel||'';const list=allUnits();if(sel&&!list.includes(sel))list.push(sel);
 return '<option value="">Par défaut</option>'+list.map(u=>`<option value="${esc(u)}"${u===sel?' selected':''}>${esc(u)}</option>`).join('')+'<option value="__other">Autre…</option>'}
function askUnit(){const v=(prompt('Nouvelle unité (ex : kg, pièce, boîte) :')||'').trim();if(!v)return null;
 if(!allUnits().includes(v)){S.units=S.units||[];S.units.push(v)}return v}
const uTxt=u=>u?' '+u:'';
const lineTotal=l=>Math.round((parseFloat(l.qty)||0)*mil(l.price));
function totals(){const sub=S.cur.lines.reduce((a,l)=>a+lineTotal(l),0);return{sub,net:sub+mil(S.cur.timbre)}}

function renderSheet(){const c=S.cur,s=S.seller,t=totals(),dv=c.type==='devis';
 const rows=c.lines.filter(l=>l.name||lineTotal(l)).map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${esc(l.qty)}${esc(uTxt(l.u))}</td><td class="r">${fmt(mil(l.price))}</td><td class="r">${fmt(lineTotal(l))}</td></tr>`).join('');
 const d=c.date?c.date.split('-').reverse().join('/'):'';
 $('sheet').innerHTML=`<div class="hd"><img class="logo" src="${LOGO}" alt=""><h3>${dv?'DEVIS':'FACTURE'} ${esc((s.owner||'').toUpperCase())}</h3><div class="meta">Date : ${esc(d)}<br>N° ${dv?'Devis':'Facture'} : ${esc(c.num)}</div></div>
 <div class="blk"><b>${esc(s.name)}${s.owner?' - '+esc(s.owner):''}</b><br>Matricule Fiscale : ${esc(s.mf)}<br>Adresse : ${esc(s.addr)}<br>Téléphone : ${esc(s.tel)}<br>Gmail : ${esc(s.mail)}${s.ig?'<br>Instagram : '+esc(s.ig):''}</div>
 <div class="blk"><b>${dv?'Devis pour :':'Facturé à :'}</b><br>Nom du client : ${esc(c.client)}<br>Matricule Fiscale : ${esc(c.cmf)}</div>
 <div class="scroll"><table><tr><th>Désignation</th><th class="r">Quantité</th><th class="r">Prix Unitaire (DT)</th><th class="r">Total (DT)</th></tr>${rows||'<tr><td colspan="4" style="color:#888">Aucun article</td></tr>'}</table></div>
 <div class="tot"><div><span>Total en DT :</span><span>${fmt(t.sub)}</span></div>${mil(c.timbre)?`<div><span>Timbre :</span><span>${fmt(mil(c.timbre))}</span></div>`:''}<div class="net"><span>${dv?'Total TTC :':'Net à payer TTC :'}</span><span>${fmt(t.net)}</span></div></div>
 <div class="words">${dv?'Arrêté le présent devis à la somme de :':'Arrêtée la présente facture à la somme de :'}<br><strong>${amountWords(t.net)}</strong></div>
 <div style="margin-top:26px;text-align:center;color:#002b60;font-size:13px">Merci pour votre confiance · ${esc(s.name)}${s.ig?' · '+esc(s.ig):''}</div>`}
function renderLines(){const box=$('lines');box.innerHTML='';
 S.cur.lines.forEach((l,i)=>{const d=document.createElement('div');d.className='line';
  d.innerHTML=`<label>Désignation<input data-k="name" value="${esc(l.name)}"></label>
  <label>Qté<input data-k="qty" type="number" step="any" min="0" value="${esc(l.qty)}"></label>
  <label>Unité<select data-k="u">${unitOpts(l.u)}</select></label>
  <label>Prix (DT)<input data-k="price" type="number" step="0.001" min="0" value="${esc(l.price)}"></label>
  <button class="x" title="Supprimer" aria-label="Supprimer la ligne">✕</button><div class="lt">Total (DT) — modifiable pour calculer la quantité : <input data-k="total" type="number" step="0.001" min="0" value="${lineTotal(l)/1000}"></div>`;
  const qi=d.querySelector('[data-k=qty]'),ti=d.querySelector('[data-k=total]');
  const syncTotal=()=>{ti.value=lineTotal(l)/1000};
  d.querySelectorAll('input').forEach(inp=>{if(inp===ti)return;inp.oninput=()=>{l[inp.dataset.k]=inp.value;syncTotal();renderSheet();persist()}});
  ti.oninput=()=>{const p=mil(l.price);if(!p||ti.value==='')return;const q=Math.round(mil(ti.value)/p*1000)/1000;l.qty=q;qi.value=q;renderSheet();persist()};
  ti.onchange=syncTotal;
  d.querySelector('select').onchange=e=>{let v=e.target.value;if(v==='__other')v=askUnit()||l.u||'';l.u=v;renderLines();renderSheet();persist()};
  d.querySelector('.x').onclick=()=>{S.cur.lines.splice(i,1);if(!S.cur.lines.length)S.cur.lines.push({name:'',qty:1,price:0});renderLines();renderSheet();persist()};
  box.appendChild(d)})}

function renderCu(){const v=$('cu').value;$('cu').innerHTML=unitOpts(v==='__other'?'':v)}
function renderCat(){renderCu();$('pick').innerHTML=S.catalog.length?S.catalog.map(a=>`<option value="${a.id}">${esc(a.name)} — ${fmt(mil(a.price))} DT${a.u?' / '+esc(a.u):''}</option>`).join(''):'<option value="">(catalogue vide)</option>';
 $('cat').innerHTML=S.catalog.map(a=>`<div class="hist"><span>${esc(a.name)} — ${fmt(mil(a.price))} DT${a.u?' / '+esc(a.u):''}</span><button class="x" data-id="${a.id}" aria-label="Supprimer l'article">✕</button></div>`).join('');
 $('cat').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.catalog=S.catalog.filter(a=>a.id!=b.dataset.id);persist();renderCat()})}

function renderHist(){const h=[...S.history].reverse();
 $('hist').innerHTML=h.length?h.map(f=>{const sub=f.lines.reduce((a,l)=>a+lineTotal(l),0)+mil(f.timbre);
  return `<div class="hist"><span><b>${f.type==='devis'?'Devis':'Facture'} ${esc(f.num)}</b> · ${esc(f.client)||'—'} · ${fmt(sub)} DT</span><span><button data-o="${f.id}">Ouvrir</button> <button class="x" data-d="${f.id}" aria-label="Supprimer">✕</button></span></div>`}).join(''):'<div style="color:var(--mute)">Aucune facture enregistrée pour l\'instant.</div>';
 $('hist').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.cur=JSON.parse(JSON.stringify(S.history.find(f=>f.id==b.dataset.o)));fillAll();window.scrollTo(0,0)});
 $('hist').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette facture ?')){S.history=S.history.filter(f=>f.id!=b.dataset.d);persist();renderHist()}})}

function labels(){const dv=S.cur.type==='devis';$('save').textContent=dv?'Enregistrer le devis':'Enregistrer la facture';$('conv').hidden=!dv;$('doch').textContent=dv?'Devis':'Facture'}
function fillAll(){const c=S.cur;if(!c.type)c.type='facture';$('type').value=c.type;labels();$('num').value=c.num;$('date').value=c.date;$('client').value=c.client;$('cmf').value=c.cmf;$('timbre').value=c.timbre;
 for(const k of['name','owner','mf','addr','tel','mail','ig'])$('s_'+k).value=S.seller[k]||'';
 renderLines();renderCat();renderHist();renderSheet();persist()}

[['num','num'],['date','date'],['client','client'],['cmf','cmf'],['timbre','timbre']].forEach(([id,k])=>$(id).oninput=e=>{S.cur[k]=e.target.value;renderSheet();persist()});
for(const k of['name','owner','mf','addr','tel','mail','ig'])$('s_'+k).oninput=e=>{S.seller[k]=e.target.value;renderSheet();persist()};
$('cu').onchange=e=>{if(e.target.value==='__other'){const v=askUnit();if(v){persist();$('cu').innerHTML=unitOpts(v)}else renderCu()}};
$('addCat').onclick=()=>{const n=$('cn').value.trim();if(!n)return;S.catalog.push({id:Date.now(),name:n,price:parseFloat($('cp').value)||0,u:$('cu').value});$('cn').value='';$('cp').value='';$('cu').value='';persist();renderCat()};
$('addPick').onclick=()=>{const a=S.catalog.find(x=>x.id==$('pick').value);if(!a)return;
 const L=S.cur.lines;if(L.length==1&&!L[0].name&&!lineTotal(L[0]))L.length=0;
 const ex=L.find(l=>l.name===a.name&&mil(l.price)===mil(a.price)&&(l.u||'')===(a.u||''));
 if(ex)ex.qty=(parseFloat(ex.qty)||0)+1;else L.push({name:a.name,qty:1,price:a.price,u:a.u||''});
 renderLines();renderSheet();persist()};
$('addBlank').onclick=()=>{S.cur.lines.push({name:'',qty:1,price:0});renderLines();renderSheet();persist()};
$('save').onclick=()=>{const i=S.history.findIndex(f=>f.id===S.cur.id);const copy=JSON.parse(JSON.stringify(S.cur));
 if(i>=0)S.history[i]=copy;else{S.history.push(copy);if(copy.type==='devis')S.counterD++;else S.counter++}persist();renderHist();alert('Document enregistré.')};
$('new').onclick=()=>{S.cur=fresh('facture');fillAll()};
$('newd').onclick=()=>{S.cur=fresh('devis');fillAll()};
$('type').onchange=e=>{const c=S.cur,t=e.target.value;c.type=t;if(!S.history.some(f=>f.id===c.id)){c.num=mknum(t);c.timbre=t==='devis'?0:1}fillAll()};
$('conv').onclick=()=>{const c=S.cur;if(!S.history.some(f=>f.id===c.id)){S.history.push(JSON.parse(JSON.stringify(c)));S.counterD++}
 const n=fresh('facture');n.client=c.client;n.cmf=c.cmf;n.lines=JSON.parse(JSON.stringify(c.lines));S.cur=n;fillAll()};
$('print').onclick=()=>window.print();
$('flink').onclick=async()=>{try{const h=await showSaveFilePicker({suggestedName:'amongout-data.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});await loadFrom(h)}catch(e){}};
$('frec').onclick=async()=>{try{if(pend&&await pend.requestPermission({mode:'readwrite'})==='granted')await loadFrom(pend)}catch(e){}};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='amongout-data.json';a.click()};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{try{merge(JSON.parse(await e.target.files[0].text()));persist();alert('Données importées.')}catch(x){alert('Fichier invalide.')}e.target.value=''};
fillAll();initFile();
</script>
</body>
